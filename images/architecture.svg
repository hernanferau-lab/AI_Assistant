<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 600" width="1180" height="600" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" role="img" aria-label="RAG demo architecture"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3a3a3a"/></marker></defs><text x="20" y="30" text-anchor="start" font-weight="600" font-size="16" fill="#141414">RAG demo: how the assistant answers from a single document</text><text x="20" y="50" text-anchor="start" font-weight="400" font-size="11" fill="#5f5f5f">Demo scope only. One short, simulated procedure based on Chile's Ley Karin principles. Python, LangChain, FAISS, OpenAI, Streamlit.</text><rect x="20" y="76" width="1140" height="120" rx="10" fill="none" stroke="#c9c9c9" stroke-width="1"/><text x="36" y="96" text-anchor="start" font-weight="600" font-size="11" fill="#5f5f5f">Indexing, on app start</text><rect x="20" y="216" width="1140" height="120" rx="10" fill="none" stroke="#c9c9c9" stroke-width="1"/><text x="36" y="236" text-anchor="start" font-weight="600" font-size="11" fill="#5f5f5f">Answering, per question</text><rect x="56.0" y="114.0" width="168" height="64" rx="8" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.1"/><text x="140" y="142.5" text-anchor="middle" font-weight="600" font-size="10.5" fill="#141414">Source document</text><text x="140" y="156.5" text-anchor="middle" font-weight="400" font-size="10" fill="#5f5f5f">protocolo.txt (simulated)</text><rect x="296.0" y="114.0" width="168" height="64" rx="8" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.1"/><text x="380" y="142.5" text-anchor="middle" font-weight="600" font-size="10.5" fill="#141414">Split into chunks</text><text x="380" y="156.5" text-anchor="middle" font-weight="400" font-size="10" fill="#5f5f5f">500 characters, 80 overlap</text><rect x="536.0" y="114.0" width="168" height="64" rx="8" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.1"/><text x="620" y="142.5" text-anchor="middle" font-weight="600" font-size="10.5" fill="#141414">Embed chunks</text><text x="620" y="156.5" text-anchor="middle" font-weight="400" font-size="10" fill="#5f5f5f">OpenAI embeddings</text><rect x="776.0" y="114.0" width="168" height="64" rx="8" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.1"/><text x="860" y="142.5" text-anchor="middle" font-weight="600" font-size="10.5" fill="#141414">Vector index</text><text x="860" y="156.5" text-anchor="middle" font-weight="400" font-size="10" fill="#5f5f5f">FAISS, in memory</text><path d="M224.0 146H296.0" fill="none" stroke="#3a3a3a" stroke-width="1.1" marker-end="url(#arrow)"/><path d="M464.0 146H536.0" fill="none" stroke="#3a3a3a" stroke-width="1.1" marker-end="url(#arrow)"/><path d="M704.0 146H776.0" fill="none" stroke="#3a3a3a" stroke-width="1.1" marker-end="url(#arrow)"/><rect x="56.0" y="254.0" width="168" height="64" rx="8" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.1"/><text x="140" y="282.5" text-anchor="middle" font-weight="600" font-size="10.5" fill="#141414">User question</text><text x="140" y="296.5" text-anchor="middle" font-weight="400" font-size="10" fill="#5f5f5f">Streamlit, max 300 chars</text><rect x="296.0" y="254.0" width="168" height="64" rx="8" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.1"/><text x="380" y="282.5" text-anchor="middle" font-weight="600" font-size="10.5" fill="#141414">Retrieve</text><text x="380" y="296.5" text-anchor="middle" font-weight="400" font-size="10" fill="#5f5f5f">top 3 chunks</text><rect x="536.0" y="254.0" width="168" height="64" rx="8" fill="#ececec" stroke="#141414" stroke-width="2"/><text x="620" y="282.5" text-anchor="middle" font-weight="600" font-size="10.5" fill="#141414">Grounded prompt</text><text x="620" y="296.5" text-anchor="middle" font-weight="400" font-size="10" fill="#5f5f5f">answer only from context</text><rect x="776.0" y="254.0" width="168" height="64" rx="8" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.1"/><text x="860" y="282.5" text-anchor="middle" font-weight="600" font-size="10.5" fill="#141414">LLM</text><text x="860" y="296.5" text-anchor="middle" font-weight="400" font-size="10" fill="#5f5f5f">gpt-4o-mini, temperature 0</text><rect x="980.0" y="254.0" width="160" height="64" rx="8" fill="#ececec" stroke="#141414" stroke-width="2"/><text x="1060" y="282.5" text-anchor="middle" font-weight="600" font-size="10.5" fill="#141414">Answer + sources</text><text x="1060" y="296.5" text-anchor="middle" font-weight="400" font-size="10" fill="#5f5f5f">fragments shown</text><path d="M224.0 286H296.0" fill="none" stroke="#3a3a3a" stroke-width="1.1" marker-end="url(#arrow)"/><path d="M464.0 286H536.0" fill="none" stroke="#3a3a3a" stroke-width="1.1" marker-end="url(#arrow)"/><path d="M704.0 286H776.0" fill="none" stroke="#3a3a3a" stroke-width="1.1" marker-end="url(#arrow)"/><path d="M944.0 286H980" fill="none" stroke="#3a3a3a" stroke-width="1.1" marker-end="url(#arrow)"/><path d="M860 178.0V198H410V254.0" fill="none" stroke="#3a3a3a" stroke-width="1.1" marker-end="url(#arrow)"/><text x="420" y="212" text-anchor="start" font-weight="400" font-size="10" fill="#5f5f5f">similarity search</text><rect x="20" y="362" width="555" height="216" rx="10" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.1"/><rect x="605" y="362" width="555" height="216" rx="10" fill="#ececec" stroke="#141414" stroke-width="1.5"/><text x="40" y="392" text-anchor="start" font-weight="600" font-size="13" fill="#141414">This demo</text><text x="625" y="392" text-anchor="start" font-weight="600" font-size="13" fill="#141414">Next: reusable template for other organisations</text><text x="40" y="424" text-anchor="start" font-weight="400" font-size="11" fill="#141414">•  One short simulated document, so retrieval returns most of it</text><text x="40" y="452" text-anchor="start" font-weight="400" font-size="11" fill="#141414">•  Index rebuilt in memory on every start</text><text x="40" y="480" text-anchor="start" font-weight="400" font-size="11" fill="#141414">•  No evaluation set yet; quality judged by hand</text><text x="40" y="508" text-anchor="start" font-weight="400" font-size="11" fill="#141414">•  Public demo: 10 questions per session, no login</text><text x="40" y="536" text-anchor="start" font-weight="400" font-size="11" fill="#141414">•  Single turn, plain text sources</text><text x="40" y="564" text-anchor="start" font-weight="400" font-size="11" fill="#141414">•  No real or personal data</text><text x="625" y="424" text-anchor="start" font-weight="400" font-size="11" fill="#141414">•  Configuration per organisation: documents, language, prompt, model</text><text x="625" y="452" text-anchor="start" font-weight="400" font-size="11" fill="#141414">•  PDF and DOCX ingestion with section metadata for citations</text><text x="625" y="480" text-anchor="start" font-weight="400" font-size="11" fill="#141414">•  Persisted index, kept separate per organisation</text><text x="625" y="508" text-anchor="start" font-weight="400" font-size="11" fill="#141414">•  Evaluation set of 20 to 30 questions per client before go-live</text><text x="625" y="536" text-anchor="start" font-weight="400" font-size="11" fill="#141414">•  Login, usage limits and logs</text><text x="625" y="564" text-anchor="start" font-weight="400" font-size="11" fill="#141414">•  Runs on the client's own infrastructure and API key</text></svg>
